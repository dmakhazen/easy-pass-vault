name: Windows release

on:
  push:
    branches: [main, master]

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The only source of the version is <Version> in the app project, the same value a local build uses.
      - name: Read the app version and refuse to publish it twice
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-Xml -Path src/EasyPassVault.App/EasyPassVault.App.csproj -XPath '//Version').Node.InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected <Version> '$version' in EasyPassVault.App.csproj." }
          $parsed = [version]$version
          $display = '{0}.{1:D2}' -f $parsed.Major, $parsed.Minor
          $tag = "v$version"

          $refs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags.' }
          if (@($refs | ConvertFrom-Json | Where-Object { $_.ref -eq "refs/tags/$tag" }).Count -gt 0) {
            throw "Release $tag already exists. Raise <Version> in src/EasyPassVault.App/EasyPassVault.App.csproj before pushing."
          }

          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "APP_DISPLAY_VERSION=$display" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          global-json-file: global.json

      - name: Build and package the portable EXE
        shell: pwsh
        run: |
          . ./scripts/Environment.ps1
          & $dotnetExe restore src/EasyPassVault.App/EasyPassVault.App.csproj --configfile NuGet.Config --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Package restore failed.' }

          $env:PathMap = "$env:GITHUB_WORKSPACE=/_/"
          $packageDirectory = '.artifacts/github-release/win-x64'
          ./scripts/Publish.ps1 -OutputDirectory $packageDirectory

          $exe = Join-Path $packageDirectory 'easy-pass-vault.exe'
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if ($productVersion -ne $env:APP_VERSION) { throw "EXE reports version '$productVersion', expected '$env:APP_VERSION'." }
          $startup = Start-Process -FilePath $exe -ArgumentList '--verify-startup' -WindowStyle Hidden -Wait -PassThru
          if ($startup.ExitCode -ne 0) { throw "Startup check failed with exit code $($startup.ExitCode)." }

          $packageFiles = 'easy-pass-vault.exe', 'COPYING.txt', 'THIRD_PARTY_NOTICES.md' |
            ForEach-Object { Join-Path $packageDirectory $_ }
          Compress-Archive -LiteralPath $packageFiles -DestinationPath .artifacts/easy-pass-vault-win-x64.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG .artifacts/easy-pass-vault-win-x64.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "easy-pass-vault $env:APP_DISPLAY_VERSION — Windows x64" `
            --notes "Версия $env:APP_DISPLAY_VERSION ($env:APP_VERSION). Распакуйте easy-pass-vault-win-x64.zip и запустите easy-pass-vault.exe."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
